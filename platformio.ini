[platformio]
default_envs = esp32dev

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
board_build.partitions = custom_partitions.csv
board_build.filesystem = littlefs
build_flags = -DCORE_DEBUG_LEVEL=0 -DENABLE_AUTO_OTA=0
board_build.f_cpu = 240000000L
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps = 
	tzapu/WiFiManager@2.0.17
	olikraus/U8g2@2.36.5
	bblanchon/ArduinoJson@7.2.0
	; squix78/JsonStreamingParser@1.0.5

; Explicit opt-in; normal validation builds never install releases automatically.
[env:esp32dev_ota]
extends = env:esp32dev
build_flags = -DCORE_DEBUG_LEVEL=0 -DENABLE_AUTO_OTA=1
